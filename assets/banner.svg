<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Cleanse</title>
  <desc id="desc">Adblock for the Blitz desktop app. No ads, no trackers, no cookie banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d25"/>
      <stop offset="1" stop-color="#060e13"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".2" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="shine" gradientTransform="rotate(20)">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <clipPath id="card"><rect width="880" height="280" rx="28"/></clipPath>
    <clipPath id="icon"><rect x="-52" y="-52" width="104" height="104" rx="18"/></clipPath>
    <clipPath id="word"><text x="330" y="134" font-size="80" font-weight="800" letter-spacing="-2">Cleanse</text></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="spark" d="M0-7 1.6-1.6 7 0 1.6 1.6 0 7-1.6 1.6-7 0-1.6-1.6Z" fill="#ccfbf1"/>
  </defs>
  <style>
    .aura, .ring, .spark { transform-box: fill-box; transform-origin: center }
    .aura { animation: pulse 3s ease-in-out infinite }
    .ring { fill: none; stroke: #5eead4; stroke-width: 2; opacity: 0; animation: cast 3s cubic-bezier(.2, .6, .3, 1) infinite }
    .spark { opacity: 0; animation: rise 3.6s ease-out infinite }
    .shine { animation: sweep 5s ease-in-out infinite }
    @keyframes pulse { 0%, 100% { transform: scale(.9); opacity: .7 } 50% { transform: scale(1.08); opacity: 1 } }
    @keyframes cast { 0% { transform: scale(.8); opacity: .8 } 100% { transform: scale(1.9); opacity: 0 } }
    @keyframes rise { 0% { transform: translateY(0) scale(.3); opacity: 0 } 25% { opacity: 1 } 100% { transform: translateY(-64px) scale(1); opacity: 0 } }
    @keyframes sweep { 0%, 50% { transform: none } 100% { transform: translateX(640px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <g clip-path="url(#card)">
    <rect width="880" height="280" fill="url(#bg)"/>
    <circle cx="760" cy="30" r="260" fill="url(#haze)"/>
    <g transform="translate(210 140)">
      <circle class="aura" r="130" fill="url(#aura)"/>
      <circle class="ring" r="60"/>
      <circle class="ring" r="60" style="animation-delay: 1s"/>
      <circle class="ring" r="60" style="animation-delay: 2s"/>
      <g transform="translate(-44 -24)"><use class="spark" href="#spark"/></g>
      <g transform="translate(38 -46)"><use class="spark" href="#spark" style="animation-delay: .6s"/></g>
      <g transform="translate(58 8)"><use class="spark" href="#spark" style="animation-delay: 1.2s"/></g>
      <g transform="translate(-60 22)"><use class="spark" href="#spark" style="animation-delay: 1.8s"/></g>
      <g transform="translate(6 -62)"><use class="spark" href="#spark" style="animation-delay: 2.4s"/></g>
      <g transform="translate(-24 50)"><use class="spark" href="#spark" style="animation-delay: 3s"/></g>
      <rect x="-58" y="-58" width="116" height="116" rx="24" fill="#2dd4bf" opacity=".45" filter="url(#blur)"/>
      <image href="data:image/png;base64," x="-52" y="-52" width="104" height="104" clip-path="url(#icon)"/>
      <rect x="-52" y="-52" width="104" height="104" rx="18" fill="none" stroke="url(#frame)" stroke-width="3"/>
      <g transform="translate(46 46)" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
        <rect x="-14" y="-14" width="28" height="28" rx="8" fill="#0b1d25" stroke="#99f6e4" stroke-width="1.5"/>
        <text y="5.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ccfbf1">D</text>
      </g>
    </g>

    <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="330" y="134" font-size="80" font-weight="800" letter-spacing="-2" fill="url(#ink)">Cleanse</text>
      <g clip-path="url(#word)"><rect class="shine" x="130" y="50" width="140" height="100" fill="url(#shine)"/></g>
      <text x="333" y="176" font-size="24" fill="#9fb8c2">Adblock for the Blitz desktop app</text>
      <g font-size="15" font-weight="600" fill="#ccfbf1">
        <rect x="333" y="198" width="84" height="32" rx="16" fill="#5eead4" fill-opacity=".1" stroke="#5eead4" stroke-opacity=".4"/>
        <text x="375" y="219" text-anchor="middle">No ads</text>
        <rect x="427" y="198" width="118" height="32" rx="16" fill="#5eead4" fill-opacity=".1" stroke="#5eead4" stroke-opacity=".4"/>
        <text x="486" y="219" text-anchor="middle">No trackers</text>
        <rect x="555" y="198" width="160" height="32" rx="16" fill="#5eead4" fill-opacity=".1" stroke="#5eead4" stroke-opacity=".4"/>
        <text x="635" y="219" text-anchor="middle">No cookie banner</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="878" height="278" rx="27" fill="none" stroke="#5eead4" stroke-opacity=".22" stroke-width="2"/>
</svg>
